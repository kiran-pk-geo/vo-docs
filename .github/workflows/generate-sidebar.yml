name: Regenerate Sidebar

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'features/**'

permissions:
  contents: write

jobs:
  sidebar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate sidebar
        run: node scripts/generate-sidebar.js

      - name: Commit if changed
        run: |
          git config user.name "kiran-pk-geo"
          git config user.email "KiranK@geoserves.com"
          git add _sidebar.md
          git diff --cached --quiet && echo "Sidebar unchanged" && exit 0
          git commit -m "chore: regenerate sidebar"
          git push
